[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-x-finance-mvp"
version = "0.5.0"
description = "Traceable Taiwan realtime source radar and official-market evidence demo"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
gxf = "global_x_finance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
